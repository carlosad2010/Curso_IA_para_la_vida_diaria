.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.95rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg)}

td:first-child{font-weight:600}

.chk{list-style:none;padding:0}
.chk li{margin:0}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{margin-top:.35em;accent-color:var(--accent);width:1.05em;height:1.05em;flex:none}

.formula{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.formula div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}

.formula strong{display:block;margin-block:4px 4px}
.formula span{font-size:.92rem;color:var(--muted)}

.traffic{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.traffic div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);min-width:0}

.traffic .g i{background:#2E9D5B}.traffic .y i{background:#E7A917}.traffic .r i{background:#D2473A}

footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}

@media (max-width:640px){

  .lk{flex-direction:column;gap:2px}
  .lk .k{width:auto}

@media (prefers-reduced-motion:no-preference){
  .route a,.lk,.btn{transition:border-color .15s}
}

/* ============ UTILIDADES ============ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(m){var h=Math.floor(m/60),mm=m%60;return h+":"+(mm<10?"0":"")+mm;}
function linkCard(id){var r=R[id];return '<li><a class="lk" href="'+esc(r.u)+'" target="_blank" rel="noopener"><span class="k">'+KIND[r.k]+'</span><span class="t"><b>'+esc(r.t)+'</b><span>'+esc(r.s)+'</span></span></a></li>';}
function inlineLinks(ids){return '<div class="inl">'+ids.map(function(id){var r=R[id];return '<a href="'+esc(r.u)+'" target="_blank" rel="noopener">'+esc(r.t.length>34?r.t.slice(0,32)+"…":r.t)+'</a>';}).join("")+'</div>';}
function promptBox(p){return '<div class="prompt"><pre>'+esc(p)+'</pre><button type="button" class="btn" data-copy>Copiar</button></div>';}
function sum(arr){return arr.reduce(function(a,b){return a+b;},0);}
function legend(){return '<div class="legend">'+Object.keys(TYPES).map(function(k){return '<span class="t-'+k+'"><i></i>'+TYPES[k].n+'</span>';}).join("")+'</div>';}
function totals(){var t={};CLASES.forEach(function(c){c.blocks.forEach(function(b){t[b.type]=(t[b.type]||0)+b.m;});});return t;}

/* ============ VISTAS ============ */

   '<div class="panel"><h3>Lo que necesitas tú</h3><ul><li>Proyector y buena conexión de wifi.</li><li>Sesión iniciada en dos o tres chatbots.</li><li>Un plan B impreso por si falla internet.</li></ul></div>'+
   '<div class="panel warn"><h3>Las herramientas cambian rápido</h3><p>Los planes gratuitos, límites y nombres de las herramientas cambian con frecuencia (por ejemplo, NotebookLM aparece ahora como Gemini Notebook). Revisa cada enlace y prueba cada práctica la semana anterior.</p></div>'+

   '<div class="panel"><h3>Estrategias para no quedarse sin cuota</h3><ul><li>Trabajar en parejas: una cuenta, dos personas pensando.</li><li>Tener al menos dos chatbots por alumno. Si uno se agota, siguen con otro.</li><li>Escribir bien el prompt antes de enviarlo, para gastar menos intentos.</li><li>Guardar los resultados buenos (captura o texto) apenas salgan.</li></ul></div>'+

   '<div class="panel soft"><h3>Planes B si se agota</h3><ul><li>Imágenes: Copilot o Canva como alternativas entre sí.</li><li>Audio y música: el docente muestra un ejemplo ya generado.</li><li>Chatbot agotado: cambiar de herramienta o seguir al día siguiente.</li><li>Hoja de cálculo: pedir la fórmula al chatbot en vez de usar funciones de IA integradas.</li></ul></div>'+

function viewClase(c){
  var acc=0, segs="", ticks="";
  var total=sum(c.blocks.map(function(b){return b.m;}));
  c.blocks.forEach(function(b){segs+='<span class="t-'+b.type+'" style="flex:'+b.m+' 1 0" title="'+esc(b.title)+' · '+b.m+' min"></span>';});
  [0,60,120,180].forEach(function(m){ticks+='<span style="left:'+(m*100/total)+'%">'+fmt(m)+'</span>';});
  var tl=c.blocks.map(function(b){
    var s=acc; acc+=b.m;
    var h='<article class="blk t-'+b.type+'"><div class="time">'+fmt(s)+' – '+fmt(acc)+'<b>'+b.m+' min</b></div><div class="body"><span class="chip"><i></i>'+TYPES[b.type].n+'</span><h4>'+esc(b.title)+'</h4><p>'+esc(b.d)+'</p>';
    if(b.steps){h+='<ul class="steps">'+b.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';}
    if(b.prompts){h+=b.prompts.map(promptBox).join("");}
    if(b.tip){h+='<div class="tip"><b>Tip</b>'+esc(b.tip)+'</div>';}
    if(b.links){h+=inlineLinks(b.links);}
    return h+'</div></article>';
  }).join("");
  return '<section class="view" id="v-'+c.id+'" hidden>'+
  '<div class="chead"><div class="eyebrow">Clase '+c.n+' de 4 · '+total+' minutos</div><h2>'+esc(c.title)+'</h2><p class="lead">'+esc(c.obj)+'</p></div>'+
  '<div class="cols sec"><div class="panel"><h3>Al terminar, el alumno podrá</h3><ul class="goals">'+c.goals.map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ul></div>'+
  '<div class="panel soft"><h3>Preparación del docente</h3><ul>'+c.prep.map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ul></div></div>'+
  '<div class="sec"><h2>Cronograma</h2><div class="bar" role="img" aria-label="Distribución de la clase por bloques">'+segs+'</div><div class="ticks" aria-hidden="true">'+ticks+'</div>'+legend()+'</div>'+
  '<div class="sec"><div class="tl">'+tl+'</div></div>'+
  '<div class="cols sec"><div class="panel"><h3>Tarea para la casa</h3><p>'+esc(c.tarea)+'</p></div><div class="panel"><h3>Consejos para ti</h3><ul>'+c.tips.map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ul></div></div>'+
  '<div class="sec"><h2>Quiz de cierre</h2>'+c.quiz.map(function(q){return '<details><summary>'+esc(q[0])+'</summary><p>'+esc(q[1])+'</p></details>';}).join("")+'</div>'+
  '<div class="sec"><h2>Recursos de la clase</h2><ul class="links">'+c.resources.map(linkCard).join("")+'</ul></div>'+
  '</section>';
}

function show(){
  var h=(location.hash||"").replace("#","");
  if(!VIEWS.some(function(v){return v.id===h;})){h="resumen";}
  VIEWS.forEach(function(v){
    document.getElementById("v-"+v.id).hidden=(v.id!==h);
  });
  Array.prototype.forEach.call(document.querySelectorAll("#nav a"),function(a){
    if(a.getAttribute("data-v")===h){a.setAttribute("aria-current","page");a.scrollIntoView({block:"nearest",inline:"center"});}else{a.removeAttribute("aria-current");}
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",show);
show();

/* copiar prompts */
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-copy]"); if(!b){return;}
  var pre=b.parentNode.querySelector("pre"), txt=pre.textContent;
  function done(){b.textContent="Copiado";b.classList.add("ok");setTimeout(function(){b.textContent="Copiar";b.classList.remove("ok");},1600);}
  function fallback(){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selecciona y copia";setTimeout(function(){b.textContent="Copiar";},2200);}
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}else{fallback();} }catch(err){fallback();}
});

/* marcas de ejercicios (solo en este navegador) */
(function(){
  var KEY="ia-vida-diaria-ejercicios", saved={};
  try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){saved={};}
  Array.prototype.forEach.call(document.querySelectorAll("[data-ck]"),function(c){
    if(saved[c.id]){c.checked=true;}
    c.addEventListener("change",function(){saved[c.id]=c.checked;try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}});
  });
})();
